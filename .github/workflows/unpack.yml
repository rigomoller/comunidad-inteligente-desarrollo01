name: Finalizar carga inicial

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto
        shell: bash
        run: |
          test -f Desarrollo01_upload.zip || exit 0
          unzip -o Desarrollo01_upload.zip
          rm Desarrollo01_upload.zip
          rm -f .github/workflows/unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publicar reconstrucción completa"
          git push
